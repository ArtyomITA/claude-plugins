<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat room</title>
<style>
  :root {
    --accent: #00a884;
    --bg: #efeae2; --pattern: rgba(0,0,0,.045); --header: #f0f2f5; --header-text: #111b21; --muted: #667781;
    --in: #ffffff; --out: #d9fdd3; --text: #111b21; --pill: #ffffffe6; --pill-text: #54656f; --border: #d1d7db;
    --link: #027eb5; --flash: #fff3b0; --input: #ffffff; --panel: #ffffff; --shadow: rgba(11,20,26,.13);
    --plan: #fff8e1; --plan-dark: #f5b400;
  }
  :root[data-theme="dark"] {
    --bg: #0b141a; --pattern: rgba(255,255,255,.03); --header: #202c33; --header-text: #e9edef; --muted: #8696a0;
    --in: #202c33; --out: #005c4b; --text: #e9edef; --pill: #182229ee; --pill-text: #8696a0; --border: #2a3942;
    --link: #53bdeb; --flash: #3b3a1a; --input: #2a3942; --panel: #111b21; --shadow: rgba(0,0,0,.35);
    --plan: #2b2a1c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 14.2px/1.42 "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; color: var(--text);
         background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; }

  /* header */
  header { background: var(--header); color: var(--header-text); padding: 9px 14px; display: flex; gap: 12px;
           align-items: center; border-bottom: 1px solid var(--border); position: relative; z-index: 2; }
  .group-icon { width: 42px; height: 42px; border-radius: 50%; background: var(--accent); display: grid;
                place-items: center; font-size: 22px; flex: none; color: #fff; }
  .head-text { min-width: 0; flex: 1; }
  .title { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live .who { font-weight: 600; }
  .live.active { color: var(--accent); }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; cursor: pointer;
              font-size: 17px; display: grid; place-items: center; color: var(--muted); flex: none; }
  .icon-btn:hover { background: rgba(127,127,127,.15); }
  .icon-btn.on { color: var(--accent); }
  #search { display: none; border: 0; border-radius: 8px; padding: 7px 10px; background: var(--input); color: var(--text);
            font: inherit; width: 200px; outline: none; }
  #search.open { display: block; }

  /* members strip */
  .strip { background: var(--header); border-bottom: 1px solid var(--border); padding: 6px 14px; display: flex;
           gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 3px; border-radius: 16px;
          background: rgba(127,127,127,.1); white-space: nowrap; }
  .chip .av { width: 22px; height: 22px; font-size: 12px; }
  .chip b { font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #aebac1; }
  .dot.on { background: #25d366; } .dot.late { background: #f5a623; }
  .dot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
  .chip.idle { opacity: .72; }
  .strip .count { margin-left: auto; }

  /* feed */
  #feed { flex: 1; overflow-y: auto; padding: 12px 5% 18px; }
  body[data-wall="dots"] #feed { background-image: radial-gradient(var(--pattern) 1.3px, transparent 1.3px); background-size: 18px 18px; }
  body[data-wall="grid"] #feed { background-image: linear-gradient(var(--pattern) 1px, transparent 1px), linear-gradient(90deg, var(--pattern) 1px, transparent 1px); background-size: 24px 24px; }
  .av { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; color: #fff;
        font-weight: 600; flex: none; box-shadow: 0 1px 2px var(--shadow); }
  .row { display: flex; gap: 8px; margin: 2px 0; align-items: flex-start; }
  .row .av { visibility: hidden; }
  .row.first { margin-top: 12px; }
  .row.first .av { visibility: visible; }
  .row.out { justify-content: flex-end; }
  .row.out .av { display: none; }
  .bubble { max-width: min(700px, 86%); background: var(--in); border-radius: 9px; padding: 6px 10px 18px;
            position: relative; box-shadow: 0 1px .5px var(--shadow); overflow-wrap: anywhere; min-width: 110px; }
  .row.out .bubble { background: var(--out); }
  .row.first:not(.out) .bubble { border-top-left-radius: 2px; }
  .row.out.first .bubble { border-top-right-radius: 2px; }
  .bubble.plan { background: var(--plan); border-left: 4px solid var(--plan-dark); }
  .who-line { display: flex; gap: 6px; align-items: baseline; margin-bottom: 2px; }
  .name { font-weight: 600; font-size: 12.8px; }
  .role { color: var(--muted); font-size: 11.5px; }
  .meta { position: absolute; right: 9px; bottom: 3px; font-size: 11px; color: var(--muted); }
  .num { color: var(--muted); font-size: 11px; margin-right: 6px; }
  .flash { animation: flash 1.6s ease; }
  @keyframes flash { 0%, 40% { background: var(--flash); } }
  .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 10px;
           margin: 0 0 5px; color: #fff; background: var(--plan-dark); }
  .badge.yes { background: #25a55f; } .badge.no { background: #d64545; }
  .pill { margin: 7px auto; width: fit-content; max-width: 84%; background: var(--pill); color: var(--pill-text);
          font-size: 12.5px; padding: 5px 12px; border-radius: 8px; box-shadow: 0 1px .5px var(--shadow); text-align: center; }
  .pill b { font-weight: 600; }
  .pill.closed { background: #25a55f; color: #fff; font-weight: 600; font-size: 13.5px; padding: 8px 16px; }
  .pill.idle { opacity: .85; font-style: italic; background: transparent; box-shadow: none;
               border: 1px dashed var(--border); }
  .pill.idle .tag { font-style: normal; font-weight: 600; }
  .hidden { display: none !important; }
  code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; background: rgba(127,127,127,.16);
         padding: 0 3px; border-radius: 3px; }
  mark { background: #ffe066; color: #111; border-radius: 2px; }
  .mention { font-weight: 600; }
  a.mention { text-decoration: none; cursor: pointer; }
  a.ref { color: var(--link); text-decoration: none; cursor: pointer; }
  a.ref:hover, a.mention:hover { text-decoration: underline; }
  table { border-collapse: collapse; margin: 5px 0; font-size: 12.5px; display: block; overflow-x: auto; }
  td, th { border: 1px solid var(--border); padding: 3px 7px; text-align: left; vertical-align: top; }
  th { font-weight: 600; background: rgba(127,127,127,.08); }
  #newer { position: fixed; right: 26px; bottom: 90px; background: var(--accent); color: #fff; border: 0; border-radius: 18px;
           padding: 8px 14px; font-weight: 600; cursor: pointer; display: none; box-shadow: 0 2px 6px rgba(0,0,0,.25); z-index: 3; }
  #empty { text-align: center; color: var(--muted); margin-top: 60px; }
  .pics { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pics img { max-width: 100%; max-height: 320px; border-radius: 6px; display: block; cursor: zoom-in;
              box-shadow: 0 1px 2px var(--shadow); background: rgba(127,127,127,.12); }
  .pics.many img { max-height: 200px; max-width: calc(50% - 3px); object-fit: cover; }
  .pill .pics { justify-content: center; } .pill .pics img { max-height: 160px; }
  #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.86); display: none; place-items: center; z-index: 20;
              cursor: zoom-out; padding: 18px; }
  #lightbox.open { display: grid; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 4px; box-shadow: 0 4px 20px rgba(0,0,0,.5); }
  #attach, #cmdBtn { background: transparent; border: 0; font-size: 20px; cursor: pointer; padding: 0 6px; color: var(--muted); height: 42px; }
  #pending { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 8px; }
  #pending:empty { display: none; }
  #pending .chip { position: relative; }
  #pending img { height: 54px; border-radius: 5px; display: block; }
  #pending button { position: absolute; top: -6px; right: -6px; border: 0; border-radius: 50%; width: 18px; height: 18px;
                    font-size: 11px; line-height: 18px; padding: 0; cursor: pointer; background: #d64545; color: #fff; }

  /* composer */
  footer { background: var(--header); padding: 8px 12px 4px; border-top: 1px solid var(--border); }
  .compose { display: flex; gap: 8px; align-items: flex-end; }
  #box { flex: 1; resize: none; border: 0; border-radius: 9px; padding: 10px 12px; background: var(--input);
         color: var(--text); font: inherit; max-height: 150px; min-height: 42px; outline: none; }
  #send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
          font-size: 18px; cursor: pointer; flex: none; }
  #send:disabled { opacity: .5; cursor: default; }
  #hint { color: var(--muted); font-size: 11.5px; padding: 4px 4px 2px; }
  footer { position: relative; }
  #cmdBtn, #attach { flex: none; }
  /* the @ and / menu above the box */
  #suggest { position: absolute; bottom: 100%; left: 12px; right: 12px; max-height: 280px; overflow-y: auto; display: none;
             background: var(--panel); border: 1px solid var(--border); border-radius: 10px; z-index: 6;
             box-shadow: 0 -4px 16px rgba(0,0,0,.2); padding: 4px 0; }
  #suggest.open { display: block; }
  #suggest .head { color: var(--muted); font-size: 11.5px; padding: 4px 12px 2px; }
  .sug { display: flex; gap: 10px; align-items: center; padding: 7px 12px; cursor: pointer; }
  .sug.on, .sug:hover { background: rgba(127,127,127,.16); }
  .sug .av { width: 26px; height: 26px; font-size: 13px; }
  .sug .ic { width: 26px; text-align: center; font-size: 17px; flex: none; }
  .sug .main { font-weight: 600; }
  .sug .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sug .txt { min-width: 0; display: flex; flex-direction: column; }

  /* settings panel */
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; z-index: 9; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--panel); z-index: 10;
           transform: translateX(100%); transition: transform .2s ease; display: flex; flex-direction: column;
           box-shadow: -4px 0 16px rgba(0,0,0,.25); }
  #panel.open { transform: none; }
  #panel.open + #scrim, body.panel-open #scrim { display: block; }
  .panel-head { background: var(--accent); color: #fff; padding: 16px 18px; font-weight: 600; font-size: 16px;
                display: flex; align-items: center; gap: 10px; }
  .panel-head button { margin-left: auto; background: transparent; border: 0; color: #fff; font-size: 20px; cursor: pointer; }
  .panel-body { padding: 14px 18px; overflow-y: auto; flex: 1; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; font-size: 12.5px; color: var(--muted); }
  .field input[type=text], .field select { border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px;
           background: var(--input); color: var(--text); font: inherit; font-size: 14px; }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .section { font-weight: 600; color: var(--text); margin: 16px 0 8px; font-size: 13px; }
  .person { display: grid; grid-template-columns: 34px 1fr 44px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .person input[type=text] { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; background: var(--input);
                              color: var(--text); font: inherit; font-size: 13px; min-width: 0; }
  .person .emoji { text-align: center; padding: 6px 2px; }
  .person .pname { grid-column: 1 / -1; font-weight: 600; font-size: 12.5px; margin-bottom: -4px; }
  input[type=color] { width: 44px; height: 32px; border: 1px solid var(--border); border-radius: 6px; background: none; padding: 2px; }
  .panel-foot { padding: 12px 18px; display: flex; gap: 10px; border-top: 1px solid var(--border); }
  .btn { flex: 1; border: 0; border-radius: 20px; padding: 10px; cursor: pointer; font-weight: 600; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: rgba(127,127,127,.15); }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--text); margin: 6px 0; cursor: pointer; }
  #saved { color: var(--accent); font-size: 12.5px; min-height: 16px; }
  @media (max-width: 640px) { .live { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2;
                                      -webkit-box-orient: vertical; }
                                #feed { padding: 10px 8px 18px; } .bubble { max-width: 92%; } #search.open { width: 120px; } }
</style>
</head>
<body data-wall="dots">
<header>
  <div class="group-icon" id="gicon">💬</div>
  <div class="head-text">
    <div class="title" id="title">Chat room</div>
    <div class="live" id="live"></div>
  </div>
  <input id="search" type="text" autocomplete="off">
  <button class="icon-btn" id="searchBtn" title="">🔍</button>
  <button class="icon-btn" id="soundBtn" title="">🔕</button>
  <button class="icon-btn" id="gear" title="">⚙</button>
</header>
<div class="strip" id="strip"></div>
<main id="feed"><div id="empty"></div></main>
<button id="newer"></button>
<div id="lightbox"><img alt=""></div>
<footer>
  <div id="suggest" role="listbox"></div>
  <div id="pending"></div>
  <div class="compose">
    <button id="cmdBtn" title="">⚡</button>
    <button id="attach" title="Allega foto · Attach pictures (anche incolla / trascina · paste or drop)">📎</button>
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
    <textarea id="box" rows="1"></textarea>
    <button id="send">➤</button>
  </div>
  <div id="hint"></div>
</footer>

<aside id="panel">
  <div class="panel-head"><span>⚙</span><span id="pTitle"></span><button id="pClose">✕</button></div>
  <div class="panel-body">
    <div class="field"><span data-t="fTitle"></span><input type="text" id="fTitle" maxlength="200"></div>
    <div class="field"><span data-t="fSubtitle"></span><input type="text" id="fSubtitle" maxlength="200"></div>
    <div class="field-row">
      <div class="field"><span data-t="fIcon"></span><input type="text" id="fIcon" maxlength="8"></div>
      <div class="field"><span data-t="fAccent"></span><input type="color" id="fAccent"></div>
    </div>
    <div class="field-row">
      <div class="field"><span data-t="fTheme"></span><select id="fTheme"><option value="auto"></option><option value="light"></option><option value="dark"></option></select></div>
      <div class="field"><span data-t="fWall"></span><select id="fWall"><option value="dots"></option><option value="grid"></option><option value="plain"></option></select></div>
      <div class="field"><span data-t="fLang"></span><select id="fLang"><option value="en">English</option><option value="it">Italiano</option></select></div>
    </div>
    <div class="section" data-t="people"></div>
    <div id="people"></div>
    <div class="section" data-t="view"></div>
    <label class="check"><input type="checkbox" id="optStatus" checked> <span data-t="optStatus"></span></label>
    <label class="check"><input type="checkbox" id="optCompact"> <span data-t="optCompact"></span></label>
    <div id="saved"></div>
  </div>
  <div class="panel-foot">
    <button class="btn ghost" id="pCancel"></button>
    <button class="btn primary" id="pSave"></button>
  </div>
</aside>
<div id="scrim"></div>

<script>
const T = {
  en: { empty: 'No messages yet.', newer: n => `↓ ${n} new`, placeholder: u => `Write to everyone as ${u}… (Enter sends, Shift+Enter new line)`,
        hint: 'Type @ to tag a participant (it wakes up and gets the alert), / or ⚡ for the quick commands.',
        cmds: 'Quick commands: they post a ready message to everyone', tagsHead: 'Tag: the participant wakes up and gets the alert',
        everyone: 'everyone',
        idle: 'idle', idleSince: (time, n) => `idle since ${time} (#${n}), wakes up on a tag`,
        messages: n => `${n} messages`, members: n => `${n} participants`, notYet: 'has not written yet',
        ago: s => s < 60 ? `${Math.round(s)} s ago` : `${Math.round(s / 60)} min ago`, lastMsg: 'last message',
        doing: 'is on:', quiet: 'waiting for the next message', search: 'Search', sound: 'Sound on new messages',
        settings: 'Settings', fTitle: 'Title', fSubtitle: 'Subtitle / goal', fIcon: 'Icon (emoji)', fAccent: 'Accent colour',
        fTheme: 'Theme', fWall: 'Background', fLang: 'Language', people: 'Participants', view: 'View',
        optStatus: 'Show statuses', optCompact: 'Compact messages', save: 'Save', cancel: 'Cancel', saved: 'Saved for everyone.',
        themes: ['Automatic', 'Light', 'Dark'], walls: ['Dots', 'Grid', 'Plain'], role: 'role', notSent: 'Not sent: ',
        unreachable: 'the viewer server is not reachable.', closed: 'Chat closed' },
  it: { empty: 'Ancora nessun messaggio.', newer: n => `↓ ${n} nuovi`, placeholder: u => `Scrivi a tutti come ${u}… (Invio manda, Maiusc+Invio a capo)`,
        hint: 'Scrivi @ per taggare un partecipante (si sveglia e riceve l\'alert), / o ⚡ per i comandi rapidi.',
        cmds: 'Comandi rapidi: mandano a tutti un messaggio pronto', tagsHead: 'Tag: il partecipante si sveglia e riceve l\'alert',
        everyone: 'tutti',
        idle: 'in attesa', idleSince: (time, n) => `in attesa dalle ${time} (#${n}), si sveglia con un tag`,
        messages: n => `${n} messaggi`, members: n => `${n} partecipanti`, notYet: 'non ha ancora scritto',
        ago: s => s < 60 ? `${Math.round(s)} s fa` : `${Math.round(s / 60)} min fa`, lastMsg: 'ultimo messaggio',
        doing: 'sta su:', quiet: 'in attesa del prossimo messaggio', search: 'Cerca', sound: 'Suono ai nuovi messaggi',
        settings: 'Impostazioni', fTitle: 'Titolo', fSubtitle: 'Sottotitolo / obiettivo', fIcon: 'Icona (emoji)', fAccent: 'Colore',
        fTheme: 'Tema', fWall: 'Sfondo', fLang: 'Lingua', people: 'Partecipanti', view: 'Vista',
        optStatus: 'Mostra gli stati', optCompact: 'Messaggi compatti', save: 'Salva', cancel: 'Annulla', saved: 'Salvato per tutti.',
        themes: ['Automatico', 'Chiaro', 'Scuro'], walls: ['Puntini', 'Griglia', 'Tinta unita'], role: 'ruolo', notSent: 'Non inviato: ',
        unreachable: 'il server della chat non risponde.', closed: 'Chat chiusa' },
};
const PALETTE = ['#1fa855', '#027eb5', '#d9730d', '#8e44ad', '#c0392b', '#16a085', '#b7950b', '#6c5ce7', '#e84393', '#0984e3'];
const $ = id => document.getElementById(id);
const feed = $('feed');
let config = {heartbeat: 120, user_name: 'USER', self_names: [], participants: [], profiles: {}, lang: 'en'};
let SELF = new Set(['USER']), shown = 0, lastFrom = null, all = [], unseen = 0, sound = false, query = '';
const t = () => T[config.lang] || T.en;

function pref(key, fallback) { try { const v = localStorage.getItem('chatroom.' + key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } }
function setPref(key, value) { try { localStorage.setItem('chatroom.' + key, JSON.stringify(value)); } catch (e) {} }

function profile(name) {
  const p = (config.profiles || {})[name] || {};
  const i = (config.participants || []).indexOf(name);
  let color = p.color;
  if (!color) {
    if (SELF.has(name)) color = '#c0392b';
    else if (i >= 0) color = PALETTE[i % PALETTE.length];
    else { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; color = PALETTE[h % PALETTE.length]; }
  }
  return {color, emoji: p.emoji || (SELF.has(name) ? '👤' : name.slice(0, 1)), role: p.role || ''};
}
function avatar(name, cls = '') {
  const p = profile(name);
  return `<div class="av ${cls}" style="background:${p.color}" title="${esc(name)}">${esc(p.emoji)}</div>`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
const EVERYONE = ['all', 'tutti', 'everyone'];
// the participant a tag points to, in any case (@nativo is NATIVO); null when nobody has that name
function canon(n) {
  const low = n.toLowerCase();
  const names = [...(config.participants || []), ...Object.keys(config.profiles || {}), ...all.map(m => m.from)];
  return names.find(x => x.toLowerCase() === low) || null;
}
function inline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/(^|[^\w@])@([A-Za-z][\w-]*)/g, (m, pre, n) => {
    if (EVERYONE.includes(n.toLowerCase())) return `${pre}<span class="mention">@${n}</span>`;
    const who = canon(n);
    if (!who) return m;
    return `${pre}<a class="mention" data-who="${esc(who)}" style="color:${profile(who).color}">@${n}</a>`;
  });
  s = s.replace(/(^|[^\w&])#(\d{1,4})\b/g, (m, pre, n) => `${pre}<a class="ref" data-ref="${n}">#${n}</a>`);
  return s;
}
function render(text) {
  const lines = text.split('\n'), out = [];
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].trim().startsWith('|')) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) { rows.push(lines[i].trim()); i++; }
      i--;
      const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const body = rows.filter(r => !cells(r).every(c => /^:?-{2,}:?$/.test(c)));
      out.push('<table>' + body.map((r, k) => '<tr>' + cells(r).map(c => k === 0 ? `<th>${inline(c)}</th>` : `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</table>');
    } else {
      out.push(inline(lines[i]) + '<br>');
    }
  }
  return out.join('').replace(/(<br>)+$/, '');
}
const isStatus = m => m.kind === 'status' || m.kind === 'stato';
const isIdle = m => m.kind === 'idle';
// the idle status of a participant whose latest message is one (posting anything else ends the idle)
function idleOf(name) {
  for (let i = all.length - 1; i >= 0; i--) if (all[i].from === name) return isIdle(all[i]) ? all[i] : null;
  return null;
}
const isClosed = text => /^(CLOSED|CHIUSO)\s*v?\d*/i.test(text);
function badge(text) {
  const plan = text.match(/^(PLAN|PIANO)\s*v\d+/i);
  if (plan) return {cls: '', label: '📋 ' + plan[0].toUpperCase(), plan: true};
  const vote = text.match(/(VOTE|VOTO)\s*v?\d+\s*:\s*(yes|no|sì|si)/i);
  if (vote) return {cls: /no/i.test(vote[2]) ? 'no' : 'yes', label: (/no/i.test(vote[2]) ? '✖ ' : '✔ ') + vote[0]};
  return null;
}
function nearBottom() { return feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140; }
function matches(m) { return !query || (m.text + ' ' + m.from).toLowerCase().includes(query); }

function pics(m) {
  const list = Array.isArray(m.images) ? m.images : [];
  if (!list.length) return '';
  return `<div class="pics${list.length > 1 ? ' many' : ''}">` +
    list.map(src => `<img loading="lazy" src="${esc(src)}" alt="#${m.n}">`).join('') + '</div>';
}
function build(m) {
  let el;
  if (isStatus(m) || isIdle(m)) {
    const p = profile(m.from), idle = isIdle(m);
    el = document.createElement('div');
    el.className = 'pill status' + (idle ? ' idle' : '');
    el.innerHTML = (idle ? '💤 ' : '') + `${esc(p.emoji)} <b style="color:${p.color}">${esc(m.from)}</b> · ` +
      (idle ? `<span class="tag">${esc(t().idle)}</span> · ` : '') +
      `${inline(m.text)} <span class="num">#${m.n} ${m.time}</span>` + pics(m);
    if (!$('optStatus').checked) el.classList.add('hidden');
    lastFrom = null;
  } else if (isClosed(m.text)) {
    el = document.createElement('div');
    el.className = 'pill closed';
    el.textContent = `✅ ${t().closed} · ${m.from}: ${m.text.split('\n')[0]} (${m.time})`;
    lastFrom = null;
  } else {
    const first = lastFrom !== m.from, p = profile(m.from), b = badge(m.text);
    el = document.createElement('div');
    el.className = 'row' + (SELF.has(m.from) ? ' out' : '') + (first ? ' first' : '');
    el.innerHTML = avatar(m.from) + `<div class="bubble${b && b.plan ? ' plan' : ''}">` +
      (first ? `<div class="who-line"><span class="name" style="color:${p.color}">${esc(m.from)}</span>` +
               (p.role ? `<span class="role">${esc(p.role)}</span>` : '') + `</div>` : '') +
      (b ? `<div class="badge ${b.cls}">${esc(b.label)}</div><br>` : '') +
      `<div class="text">${render(m.text)}</div>` + pics(m) +
      `<div class="meta"><span class="num">#${m.n}</span>${m.time}</div></div>`;
    lastFrom = m.from;
  }
  el.id = 'm' + m.n;
  el.dataset.n = m.n;
  if (!matches(m)) el.classList.add('hidden');
  return el;
}
function add(m) {
  const stick = nearBottom();
  $('empty')?.remove();
  feed.appendChild(build(m));
  if (stick) feed.scrollTop = feed.scrollHeight;
  else { unseen++; $('newer').textContent = t().newer(unseen); $('newer').style.display = 'block'; }
}
function rerender() {
  const stick = nearBottom();
  feed.innerHTML = all.length ? '' : `<div id="empty">${esc(t().empty)}</div>`;
  lastFrom = null;
  for (const m of all) feed.appendChild(build(m));
  if (stick) feed.scrollTop = feed.scrollHeight;
}

function stamp(m) {
  if (m.ts) return m.ts * 1000;
  const [h, mi, s] = m.time.split(':').map(Number), d = new Date(); d.setHours(h, mi, s, 0); return d.getTime();
}
function header() {
  const names = [...new Set([...(config.participants || []), ...all.map(m => m.from)])];
  const now = Date.now(), hb = config.heartbeat || 120;
  const idle = new Map(names.map(n => [n, idleOf(n)]).filter(([, m]) => m));
  setHTML($('strip'), names.map(n => {
    const mine = all.filter(m => m.from === n), last = mine[mine.length - 1];
    const age = last ? (now - stamp(last)) / 1000 : null, p = profile(n), sleeping = idle.get(n);
    const cls = SELF.has(n) || age === null ? '' : sleeping ? 'idle' : age <= hb ? 'on' : 'late';
    const title = (p.role ? p.role + ' · ' : '') + (sleeping ? t().idleSince(sleeping.time, sleeping.n)
      : age === null ? t().notYet : `${t().lastMsg} ${t().ago(age)}`);
    return `<span class="chip${sleeping ? ' idle' : ''}" title="${esc(title)}">${avatar(n)}<b style="color:${p.color}">${esc(n)}</b> ${mine.length}<span class="dot ${cls}"></span></span>`;
  }).join('') + `<span class="count">${esc(t().messages(all.length))}</span>`);
  // the "typing…" line: the freshest status of an agent still inside its timer and not idle
  const fresh = all.filter(m => isStatus(m) && !SELF.has(m.from) && !idle.has(m.from) && (now - stamp(m)) / 1000 <= hb);
  const live = $('live');
  if (fresh.length) {
    const m = fresh[fresh.length - 1], p = profile(m.from);
    live.className = 'live active';
    setHTML(live, `${esc(p.emoji)} <span class="who">${esc(m.from)}</span> ${esc(t().doing)} ${inline(m.text.split('\n')[0])}`);
  } else {
    live.className = 'live';
    setHTML(live, esc(config.subtitle || t().members(names.length)));
  }
}
// replace an element's HTML only when it changed: header() runs every few seconds, and rebuilding the line under
// the pointer between mousedown and mouseup would swallow a click on one of its links
function setHTML(el, html) { if (el._html !== html) { el.innerHTML = html; el._html = html; } }

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 880; g.gain.value = .06; o.connect(g); g.connect(ctx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .18); o.stop(ctx.currentTime + .2);
  } catch (e) {}
}

function applyLook() {
  SELF = new Set([config.user_name || 'USER', ...(config.self_names || [])]);
  const theme = config.theme === 'dark' || (config.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  document.documentElement.style.setProperty('--accent', config.accent || '#00a884');
  document.documentElement.lang = config.lang || 'en';
  document.body.dataset.wall = config.wallpaper || 'dots';
  $('gicon').textContent = config.icon || '💬';
  $('title').textContent = config.title || config.topic || 'Chat room';
  document.title = config.title || config.topic || 'Chat room';
  const L = t();
  $('box').placeholder = L.placeholder(config.user_name || 'USER');
  $('hint').textContent = L.hint;
  $('cmdBtn').title = L.cmds;
  if (COMMANDS.length && COMMANDS._lang !== config.lang) loadCommands().then(() => { COMMANDS._lang = config.lang; });
  $('search').placeholder = L.search;
  $('searchBtn').title = L.search; $('soundBtn').title = L.sound; $('gear').title = L.settings;
  $('pTitle').textContent = L.settings; $('pSave').textContent = L.save; $('pCancel').textContent = L.cancel;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = L[el.dataset.t]);
  [...$('fTheme').options].forEach((o, i) => o.textContent = L.themes[i]);
  [...$('fWall').options].forEach((o, i) => o.textContent = L.walls[i]);
  const e = $('empty'); if (e) e.textContent = L.empty;
}
let configText = '';
async function loadConfig(force) {
  try {
    const r = await fetch('config.json?t=' + Date.now(), {cache: 'no-store'});
    if (r.ok) {
      // compare the server's text, not the merged object: its keys come in another order, so the old comparison
      // saw a change every 5 s and rebuilt the whole feed, cutting the flash of a #n jump and hiding again a
      // status just opened by a click
      const text = await r.text();
      const changed = text !== configText;
      configText = text;
      config = Object.assign({}, config, JSON.parse(text));
      if (changed || force) { applyLook(); rerender(); }
    }
  } catch (e) {}
}
async function poll() {
  try {
    const r = await fetch('chat.jsonl?t=' + Date.now(), {cache: 'no-store'});
    if (r.ok) {
      const next = [];
      for (const l of (await r.text()).split('\n')) { if (l.trim()) { try { next.push(JSON.parse(l)); } catch (e) {} } }
      all = next;
      const fresh = all.slice(shown);
      for (const m of fresh) add(m);
      if (fresh.length && shown && sound && fresh.some(m => !SELF.has(m.from))) beep();
      if (fresh.length) document.title = `(${all.length}) ${config.title || config.topic || 'Chat room'}`;
      shown = Math.max(shown, all.length);
    }
  } catch (e) {}
  header();
}

/* composer */
const box = $('box'), send = $('send');
let pending = [];
function showPending() {
  $('pending').innerHTML = pending.map((f, i) =>
    `<span class="chip"><img src="${f.data}" alt=""><button data-i="${i}" title="✕">✕</button></span>`).join('');
}
function addFiles(files) {
  for (const file of files) {
    if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type) || pending.length >= 6) continue;
    const reader = new FileReader();
    reader.onload = () => {
      const ext = {'image/png': '.png', 'image/jpeg': '.jpg', 'image/webp': '.webp', 'image/gif': '.gif'}[file.type];
      const name = file.name && /\.[A-Za-z]+$/.test(file.name) ? file.name : 'foto' + ext;
      pending.push({name, data: reader.result}); showPending();
    };
    reader.readAsDataURL(file);
  }
}
async function sendMessage() {
  const text = box.value.trim(); if (!text && !pending.length) return;
  send.disabled = true;
  try {
    const r = await fetch('post', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                   body: JSON.stringify({text, images: pending})});
    if (r.ok) { box.value = ''; box.style.height = ''; pending = []; showPending(); feed.scrollTop = feed.scrollHeight; poll(); }
    else alert(t().notSent + await r.text());
  } catch (e) { alert(t().notSent + t().unreachable); }
  send.disabled = false; box.focus();
}
send.addEventListener('click', sendMessage);
$('attach').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
$('pending').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  pending.splice(+b.dataset.i, 1); showPending(); });
box.addEventListener('paste', e => { const files = [...(e.clipboardData || {}).files || []]; if (files.length) { e.preventDefault(); addFiles(files); } });
document.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
document.addEventListener('drop', e => { if (e.dataTransfer.files.length) { e.preventDefault(); addFiles(e.dataTransfer.files); } });
feed.addEventListener('click', e => { const img = e.target.closest('.pics img'); if (!img) return;
  $('lightbox').querySelector('img').src = img.src; $('lightbox').classList.add('open'); });
$('lightbox').addEventListener('click', () => $('lightbox').classList.remove('open'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('lightbox').classList.remove('open'); });
/* @ tags and / quick commands: a menu above the box, filtered as you type, in any case */
let COMMANDS = [], sug = {mode: null, items: [], on: 0, from: 0};
async function loadCommands() {
  try { const r = await fetch('commands.json?t=' + Date.now(), {cache: 'no-store'}); if (r.ok) COMMANDS = await r.json(); }
  catch (e) {}
}
function taggable() {
  const names = [...(config.participants || []), ...Object.keys(config.profiles || {})].filter(n => !SELF.has(n));
  return [...new Set(names)];
}
function closeSuggest() { sug.mode = null; $('suggest').classList.remove('open'); }
function showSuggest(mode, query, from) {
  const q = query.toLowerCase();
  let items;
  if (mode === 'tag') {
    const every = config.lang === 'it' ? 'tutti' : 'all';
    items = [...taggable().map(n => ({kind: 'tag', name: n})), {kind: 'tag', name: every, all: true}]
      .filter(x => x.name.toLowerCase().includes(q))
      .sort((a, b) => a.name.toLowerCase().startsWith(q) === b.name.toLowerCase().startsWith(q) ? 0
                      : a.name.toLowerCase().startsWith(q) ? -1 : 1);
  } else {
    items = COMMANDS.filter(c => (c.name + ' ' + c.key + ' ' + c.label).toLowerCase().includes(q))
      .map(c => Object.assign({kind: 'cmd'}, c));
  }
  if (!items.length) return closeSuggest();
  sug = {mode, items, on: 0, from};
  renderSuggest();
}
function renderSuggest() {
  const L = t();
  $('suggest').innerHTML = `<div class="head">${esc(sug.mode === 'tag' ? L.tagsHead : L.cmds)}</div>` +
    sug.items.map((x, i) => {
      const cls = 'sug' + (i === sug.on ? ' on' : '');
      if (x.kind === 'cmd')
        return `<div class="${cls}" data-i="${i}"><span class="ic">${esc(x.icon)}</span><span class="txt">` +
               `<span class="main">/${esc(x.name)}</span><span class="sub">${esc(x.label)}</span></span></div>`;
      const p = profile(x.name);
      return `<div class="${cls}" data-i="${i}">` + (x.all ? '<span class="ic">📣</span>' : avatar(x.name)) +
             `<span class="txt"><span class="main">@${esc(x.name)}</span><span class="sub">` +
             `${esc(x.all ? L.everyone : p.role)}</span></span></div>`;
    }).join('');
  $('suggest').classList.add('open');
  const on = $('suggest').querySelector('.sug.on'); if (on) on.scrollIntoView({block: 'nearest'});
}
function updateSuggest() {
  const before = box.value.slice(0, box.selectionStart);
  if (/^\/[\w-]*$/.test(before)) return showSuggest('cmd', before.slice(1), 0);
  const m = before.match(/(^|[^\w@])@([\w-]*)$/);
  if (m) return showSuggest('tag', m[2], before.length - m[2].length - 1);
  closeSuggest();
}
async function runCommand(c) {
  closeSuggest();
  try {
    const r = await fetch('command', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                      body: JSON.stringify({name: c.key})});
    if (r.ok) { if (/^\/[\w-]*$/.test(box.value.trim())) box.value = ''; feed.scrollTop = feed.scrollHeight; poll(); }
    else alert(t().notSent + await r.text());
  } catch (e) { alert(t().notSent + t().unreachable); }
  box.focus();
}
function pick(i) {
  const x = sug.items[i]; if (!x) return;
  if (x.kind === 'cmd') return runCommand(x);
  const end = box.selectionStart, insert = '@' + x.name + ' ';
  box.value = box.value.slice(0, sug.from) + insert + box.value.slice(end);
  const caret = sug.from + insert.length;
  box.setSelectionRange(caret, caret);
  closeSuggest(); box.focus();
}
$('suggest').addEventListener('mousedown', e => { const el = e.target.closest('.sug'); if (!el) return;
  e.preventDefault(); pick(+el.dataset.i); });
$('cmdBtn').addEventListener('click', () => { if (sug.mode === 'cmd') return closeSuggest();
  showSuggest('cmd', '', 0); box.focus(); });
box.addEventListener('input', updateSuggest);
box.addEventListener('click', updateSuggest);
box.addEventListener('blur', e => { if (e.relatedTarget && e.relatedTarget.id === 'cmdBtn') return;
  setTimeout(() => { if (document.activeElement !== box) closeSuggest(); }, 150); });
box.addEventListener('keydown', e => {
  if (sug.mode) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); sug.on = (sug.on + (e.key === 'ArrowDown' ? 1 : -1) + sug.items.length) % sug.items.length;
      return renderSuggest();
    }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); return pick(sug.on); }
    if (e.key === 'Escape') { e.preventDefault(); return closeSuggest(); }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
box.addEventListener('input', () => { box.style.height = ''; box.style.height = Math.min(box.scrollHeight, 150) + 'px'; });

/* feed interactions: #n jumps to message n, @NAME to that participant's latest message, wherever the link is
   (bubbles, status pills, the live line in the header) */
function jumpTo(n) {
  const target = $('m' + n); if (!target) return;
  target.classList.remove('hidden');
  const flash = target.querySelector('.bubble') || target;
  target.scrollIntoView({behavior: 'smooth', block: 'center'});
  flash.classList.remove('flash'); void flash.offsetWidth; flash.classList.add('flash');
}
document.addEventListener('click', e => {
  const a = e.target.closest('a.ref, a.mention'); if (!a) return;
  e.preventDefault();
  if (a.dataset.ref) return jumpTo(a.dataset.ref);
  const who = (a.dataset.who || '').toLowerCase();
  for (let i = all.length - 1; i >= 0; i--) if (all[i].from.toLowerCase() === who) return jumpTo(all[i].n);
});
feed.addEventListener('scroll', () => { if (nearBottom()) { unseen = 0; $('newer').style.display = 'none'; } });
$('newer').addEventListener('click', () => { feed.scrollTop = feed.scrollHeight; });

/* search and sound */
$('searchBtn').addEventListener('click', () => { const s = $('search'); s.classList.toggle('open'); if (s.classList.contains('open')) s.focus(); else { s.value = ''; query = ''; rerender(); } });
$('search').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); rerender(); });
function setSound(on) { sound = on; $('soundBtn').textContent = on ? '🔔' : '🔕'; $('soundBtn').classList.toggle('on', on); setPref('sound', on); }
$('soundBtn').addEventListener('click', () => setSound(!sound));

/* settings panel */
function openPanel() {
  $('fTitle').value = config.title || config.topic || ''; $('fSubtitle').value = config.subtitle || ''; $('fIcon').value = config.icon || '💬';
  $('fAccent').value = config.accent || '#00a884'; $('fTheme').value = config.theme || 'auto';
  $('fWall').value = config.wallpaper || 'dots'; $('fLang').value = config.lang || 'en'; $('saved').textContent = '';
  const names = [...new Set([...(config.participants || []), ...all.map(m => m.from)])].filter(n => !SELF.has(n));
  $('people').innerHTML = names.map(n => {
    const p = profile(n);
    return `<div class="person" data-name="${esc(n)}"><div class="pname" style="color:${p.color}">${esc(n)}</div>` +
      `<input type="text" class="emoji" maxlength="8" value="${esc(p.emoji)}">` +
      `<input type="text" class="prole" maxlength="120" placeholder="${esc(t().role)}" value="${esc(p.role)}">` +
      `<input type="color" class="pcolor" value="${p.color}"></div>`;
  }).join('');
  $('panel').classList.add('open'); document.body.classList.add('panel-open');
}
function closePanel() { $('panel').classList.remove('open'); document.body.classList.remove('panel-open'); }
async function savePanel() {
  const profiles = {};
  document.querySelectorAll('#people .person').forEach(row => {
    profiles[row.dataset.name] = {emoji: row.querySelector('.emoji').value.trim() || row.dataset.name.slice(0, 1),
                                  role: row.querySelector('.prole').value.trim(), color: row.querySelector('.pcolor').value};
  });
  const body = {title: $('fTitle').value.trim() || 'Chat room', subtitle: $('fSubtitle').value.trim(), icon: $('fIcon').value.trim() || '💬',
                accent: $('fAccent').value, theme: $('fTheme').value, wallpaper: $('fWall').value, lang: $('fLang').value, profiles};
  try {
    const r = await fetch('config', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    if (!r.ok) { $('saved').textContent = t().notSent + await r.text(); return; }
    config = Object.assign({}, config, await r.json()); applyLook(); rerender(); header();
    $('saved').textContent = t().saved;
    setTimeout(closePanel, 600);
  } catch (e) { $('saved').textContent = t().notSent + t().unreachable; }
}
$('gear').addEventListener('click', openPanel);
$('pClose').addEventListener('click', closePanel);
$('pCancel').addEventListener('click', closePanel);
$('scrim').addEventListener('click', closePanel);
$('pSave').addEventListener('click', savePanel);
$('optStatus').addEventListener('change', e => { setPref('statuses', e.target.checked); rerender(); });
$('optCompact').addEventListener('change', e => { setPref('compact', e.target.checked); document.body.style.fontSize = e.target.checked ? '13px' : ''; });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyLook);

$('optStatus').checked = pref('statuses', true);
$('optCompact').checked = pref('compact', false);
if ($('optCompact').checked) document.body.style.fontSize = '13px';
setSound(pref('sound', false));
applyLook();
loadCommands().then(() => { COMMANDS._lang = config.lang; });
loadConfig(true).then(() => { poll(); setInterval(poll, 1500); setInterval(() => loadConfig(false), 5000); setInterval(header, 5000); });
</script>
